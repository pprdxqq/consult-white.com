<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f5f0">
<meta name="description" content="Consult White unterstützt Zahnarzt-, KFO- und MKG-Praxen sowie Dentallabore in Praxismanagement, Abrechnung, Marketing und individuellen KI-Lösungen.">
<title>Datenschutz – Consult White</title>
<link rel="stylesheet" href="styles.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cw-theme')||'light'}catch(e){}</script>
</head>
<body data-page="datenschutz">
<div id="app"></div>
<div class="modal-backdrop" id="welcomeModal" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle">
 <div class="welcome">
  <div class="eyebrow">Consult White</div>
  <h2 id="welcomeTitle">Wie möchten Sie die Website erleben?</h2>
  <p>Wählen Sie Ihre Sprache und Darstellung. Sie können beides später jederzeit ändern.</p>
  <div class="eyebrow">Sprache / Language</div>
  <div class="choicegroup">
   <button class="choice" data-choice="lang:de" aria-pressed="true">Deutsch<small>Website auf Deutsch</small></button>
   <button class="choice" data-choice="lang:en" aria-pressed="false">English<small>View in English</small></button>
  </div>
  <div class="eyebrow">Darstellung / Appearance</div>
  <div class="choicegroup">
   <button class="choice" data-choice="theme:light" aria-pressed="true">Hell<small>Light mode</small></button>
   <button class="choice" data-choice="theme:dark" aria-pressed="false">Dunkel<small>Dark mode</small></button>
  </div>
  <button class="btn" id="startSite">Auswahl übernehmen ↗</button>
 </div>
</div>
<script src="site.js"></script>
</body>
</html>
